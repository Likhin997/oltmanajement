# =============================================================================
# Docker Compose — JETCYBERNET SmartOLT Web App (Terpisah dari Container DB)
# - Port Aplikasi Web: 3004 (http://localhost:3004)
# - Koneksi PostgreSQL Host: localhost:5435 (via host.docker.internal:5435)
#   User: likhin | Pass: 11013009 | Port: 5435
# =============================================================================

services:
  smartolt-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jetcybernet-smartolt-app
    restart: unless-stopped
    ports:
      - "3004:3004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - PG_HOST=host.docker.internal
      - PG_PORT=5435
      - PG_USER=likhin
      - PG_PASSWORD=11013009
      - PG_DATABASE=smartolt_db
      - SQLITE_PATH=/app/data/smartolt_live.sqlite
    volumes:
      - ./data:/app/data
